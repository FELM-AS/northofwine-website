# Manufacturer `country` (fixed 13-value Contentful enum) -> language code,
# for the `lang` attribute on product/manufacturer names (see
# planning/Plan.md "Formatting" and "Hyphenation"). Deliberately explicit,
# not derived from the country name, since the mapping isn't 1:1 in
# general (only happens to be for these 13 values today).
#
# NOT fetched from Contentful -- a manually-maintained shadow of the
# actual schema enum. contentful_listing_pages.rb also uses these keys
# as "the 13 valid countries" to generate Produsenter's filter pages.
# If Contentful's country enum ever changes (e.g. a manufacturer from a
# genuinely new country), this file needs a manual update too, with no
# build warning if it's forgotten. See the roadmap's "Known
# limitations" section for a more robust alternative (fetching the
# enum from Contentful's own content type validations).
Frankrike: fr
Italia: it
Tyskland: de
Østerrike: de
Spania: es
Portugal: pt
Ungarn: hu
Chile: es
Argentina: es
Australia: en
New Zealand: en
USA: en
Norge: nb
