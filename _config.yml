title: North of Wine
description: North of Wine AS – vinimportør i Trondheim.
# STAGING VALUES -- northofwine.no is still in use by the current
# production site and won't be free to point here until this site
# itself is ready to go live. Until then, GitHub Pages serves this repo
# at https://felm-as.github.io/northofwine-website/ (a project-site
# subpath, not a domain root), so baseurl has to carry that path or
# every relative_url/absolute_url link, asset, and canonical/OG tag
# 404s. When cutting over: set baseurl back to "", url to
# "https://northofwine.no", and add a CNAME file (see CLAUDE.md's "Why
# GitHub Actions instead of native GitHub Pages builds" section).
baseurl: "/northofwine-website"
url: "https://felm-as.github.io"
# Primary language for <html lang> (see _layouts/default.html) -- update
# if the primary locale below isn't English. Other configured locales get
# their own <html lang> from their Contentful locale code automatically.
lang: nb

# Plan.md's Analytics section: GoatCounter (goatcounter.com), a free,
# cookie-less analytics service -- no consent banner needed, unlike
# Google Analytics. Unset until a GoatCounter account/site exists;
# _layouts/default.html only emits the tracking snippet when this is
# set, so leaving it unset keeps every page (including 404.html) free
# of any analytics request, same as today. Set to the site code (the
# <mysite> in https://<mysite>.goatcounter.com) once an account exists.
# goatcounter_code: mysite

# Contentful content types this site pulls entries from. Each entry
# becomes a generated page at /<dir>/<slug>/ (dir: "" = site root).
# home: true groups it into a homepage section (see index.html), headed
# by label (string, or a Hash keyed by locale code) or a humanized
# content_type. order takes a Contentful CDA order value (default
# "-sys.updatedAt"). body_field sets a different content field name
# (needed if it's literally "content", which collides with Jekyll's
# page.content). image_field sets a different Open Graph/Twitter image
# field (see _includes/seo.html), exposed as page.social_image either
# way. (No nav: true here -- this site's nav is the fixed Menu
# component (planning/Plan-Issues.md #12), not collection-driven.)
contentful_collections:
  # Only Product gets a generated page per entry (see planning/Plan.md and
  # planning/Contentful-Content-Model.md). `layout: product` is the full
  # detail page (grape composition, sensory ratings, food pairing --
  # Plan-Issues.md #21, _layouts/product.html). `description` is
  # Product's body-ish field; there's no literal `body`.
  - content_type: product
    layout: product
    dir: utvalg
    body_field: description

# Optional: how deep a linked entry's own fields get flattened before
# falling back to an {id, link_type} stub. Defaults to 2 if unset.
# contentful_entry_depth: 2

# Build every collection/data collection once per locale (from Contentful
# Settings > Locales). With 2+ locales, the first is primary (unprefixed
# URLs/site.data keys); every other locale gets its own /<prefix>/... URL
# prefix and site.data.<name>_<prefix> key. An entry is a bare code
# (prefix == code) or {code:, prefix:} for a different prefix -- quote a
# prefix that could look like a YAML boolean (no/yes/on/off), or it
# becomes true/false.
#
# Norwegian only at launch (planning/Plan.md's Internationalization
# section) -- nb-NO listed explicitly, alone, rather than omitting this
# setting entirely, so every query already sends its own explicit
# `locale: nb-NO` param instead of silently relying on the Contentful
# space's own default locale matching it. That's what "reserves" the
# locale URL convention now: adding a second locale later (e.g. en-US,
# appended after nb-NO so it stays primary) is a one-line config change,
# not a migration -- nb-NO's own URLs/site.data keys don't change either
# way, since the primary locale is always unprefixed.
contentful_locales:
  - nb-NO

# Content types fetched into site.data.<name> instead of generated pages
# -- for entries only ever linked to from others (e.g. authors,
# manufacturers), with no page of their own.
# Manufacturer and Person have no detail page of their own (Plan.md) --
# fetched as data, consumed by Product pages and the Produsenter/Om oss
# pages once those exist. `dir` here isn't read by the Contentful
# generator itself (data collections still don't get per-entry pages)
# -- it's a single source of truth for the Produsenter root/country
# listing pages that _plugins/contentful_listing_pages.rb builds.
contentful_data_collections:
  - content_type: manufacturer
    name: manufacturers
    dir: produsenter
  - content_type: person
    name: people

exclude:
  - README.md
  - CLAUDE.md
  - .env.example
  - planning/
