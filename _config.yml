title: North of Wine
baseurl: ""
url: "https://northofwine.no"
# <html lang> for primary-locale pages.
lang: nb

# GoatCounter site code (the <code> in https://<code>.goatcounter.com).
# No analytics snippet is emitted while unset.
goatcounter_code: northofwine

# Content types that get a generated page per entry, at /<dir>/<slug>/.
# Keys are documented in CLAUDE.md ("How a page gets built").
contentful_collections:
  - content_type: product
    layout: product
    dir: utvalg
    body_field: description
    order: fields.productShortName

# Content types fetched into site.data.<name> instead (no page per entry).
# `dir` is where contentful_listing_pages.rb builds their listing pages.
contentful_data_collections:
  - content_type: manufacturer
    name: manufacturers
    dir: produsenter
    body_field: description
    order: fields.name
  - content_type: person
    name: people
    dir: omoss
    body_field: description

# First entry is the primary locale (unprefixed URLs). Each locale also
# needs a _data/i18n/<code>.yml. Quote a prefix like "no" -- YAML reads a
# bare no/yes/on/off as a boolean.
contentful_locales:
  - nb-NO

# How deep linked entries are flattened before becoming {id, link_type}
# stubs. Default 2.
# contentful_entry_depth: 2

# A single line break in a Markdown description becomes a <br>, as
# editors expect from Contentful's plain Text fields. Quotes are
# Norwegian: «» outside, ‘’ inside.
kramdown:
  hard_wrap: true
  smart_quotes: lsquo,rsquo,laquo,raquo

exclude:
  - README.md
  - CLAUDE.md
  - .env.example
  - planning/
