{% comment %}
  Icon-only <button> for the menu's open/close controls -- the native
  <dialog> needs a real <button>, not button.html's <a>.

  Params:
    type          - required, "button" or "submit"
    id            - optional, element id
    aria_controls - optional, id of the element this button controls
    aria_label    - required accessible name (there's no visible text)
    icon          - required, icon path under _includes/icons/
    class         - optional, any additional classes
{% endcomment %}
<button class="button{% if include.class %} {{ include.class | escape }}{% endif %}" type="{{ include.type }}"{% if include.id %} id="{{ include.id | escape }}"{% endif %}{% if include.aria_controls %} aria-controls="{{ include.aria_controls | escape }}"{% endif %} aria-label="{{ include.aria_label | escape }}">
  {% include icons/{{ include.icon }}.svg %}
</button>
