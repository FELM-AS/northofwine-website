name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # Contentful publish webhook; see CLAUDE.md's "Contentful publish trigger".
  repository_dispatch:
    types: [contentful-publish]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Contentful-triggered runs are skipped while the
    # CONTENTFUL_AUTOBUILD_DISABLED variable is "true" (see CLAUDE.md).
    if: github.event_name != 'repository_dispatch' || vars.CONTENTFUL_AUTOBUILD_DISABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build with Jekyll
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
          CONTENTFUL_ENVIRONMENT: ${{ secrets.CONTENTFUL_ENVIRONMENT }}
          JEKYLL_ENV: production
        run: bundle exec jekyll build
      - name: Check links (html-proofer)
        # Fails the build (and so the deploy) on a broken link.
        # --checks Links,Scripts: no Images check -- a missing Contentful
        #   image shouldn't block deploys; image-fallback.js covers it.
        # --ignore-urls: absolute links to our own site (the canonical tag)
        #   would be checked against the live site, so a new page would
        #   fail on its own canonical URL before it's ever deployed.
        # --no-enforce-https: an http link isn't a broken link.
        # --only-4xx: external redirects, timeouts, 5xx and DNS failures
        #   are other sites' problems, not ours to block on.
        # --ignore-status-codes 429: rate limiting isn't a broken link.
        # --assume-extension "": otherwise /utvalg/ resolves to the
        #   utvalg.html old-URL redirect instead of utvalg/index.html.
        run: |
          bundle exec htmlproofer ./_site \
            --checks Links,Scripts \
            --ignore-urls "/^https:\/\/northofwine\.no/" \
            --no-enforce-https \
            --only-4xx \
            --ignore-status-codes 429 \
            --assume-extension ""
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
